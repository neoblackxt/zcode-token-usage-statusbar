name: release

# clean 分叉发布流水线：打 v* 标签（或手动输入版本号）→ 一致性预检 →
# release_tool 构建（确定性 ZIP + release-manifest.json，仓库绑定本分叉）→
# verify 复核 → 创建带完整发布包的正式 GitHub Release。
# ⚙ 面板的「GitHub 正式 Release（校验 ZIP 与 SHA256）」通道与更新日志卡片
# 都以此 Release 为准——没有它，面板会报"尚无带完整发布包的正式 Release"。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（X.Y.Z，必须与 .zcode-plugin/plugin.json 一致）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: 解析版本号与标签
        id: ver
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "版本号必须是 X.Y.Z，收到：$V"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: 一致性预检（副本一致 + 版本对齐 + 语法）
        run: |
          set -eu
          python sync_plugin.py --check
          V="${{ steps.ver.outputs.version }}"
          M="$(python -c "import json;print(json.load(open('plugins/zcode-token-usage-statusbar/.zcode-plugin/plugin.json'))['version'])")"
          [ "$M" = "$V" ] || { echo "清单版本 $M ≠ 发布版本 $V，请先对齐"; exit 1; }
          node --check inject-main.cjs
          node --check plugin-updater.cjs
          node --check engine-patch.cjs
          node --check overlay.js

      - name: 构建发布包（确定性 ZIP + manifest，绑定本仓库）
        run: |
          set -eu
          rm -rf dist
          python release_tool.py build \
            --repo "${{ github.repository }}" \
            --out dist \
            --version "${{ steps.ver.outputs.version }}"

      - name: verify 复核（SHA256 / SEMVER / 清单身份）
        run: |
          set -eu
          python release_tool.py verify \
            --repo "${{ github.repository }}" \
            --zip "dist/zcode-token-usage-statusbar-v${{ steps.ver.outputs.version }}.zip" \
            --manifest dist/release-manifest.json

      - name: 创建正式 Release（发布包资产 + 标签注记为更新日志）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          # checkout 浅检出会把标签降级为轻量标签（%(contents) 将变成 commit 提交信息）；
          # 显式重取标签引用，带回注解对象（发布说明正文）。
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          mkdir -p .release
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > .release/notes.md
          else
            printf 'v%s\n\n（打标签时未写注记；完整说明见提交历史。）\n' \
              "${{ steps.ver.outputs.version }}" > .release/notes.md
          fi
          gh release create "$TAG" \
            "dist/zcode-token-usage-statusbar-v${{ steps.ver.outputs.version }}.zip" \
            dist/release-manifest.json \
            --repo "${{ github.repository }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --notes-file .release/notes.md \
            --latest
